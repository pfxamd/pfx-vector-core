[workspace]
resolver = "2"
members = [
    "crates/pfx-vector-core",
    "crates/pfx-vector-svg",
    "crates/pfx-vector-wasm",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
authors = ["pfxamd"]
repository = "https://github.com/pfxamd/pfx-vector-core"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
