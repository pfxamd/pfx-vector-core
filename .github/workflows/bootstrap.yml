name: PFx Vector Core Bootstrap

on:
  push:
    paths:
      - ".pfx-bootstrap-payload.b64"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack repository payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .pfx-bootstrap-payload.b64 > /tmp/pfx-vector-core.zip
          rm -rf /tmp/pfx-vector-core
          mkdir -p /tmp/pfx-vector-core
          unzip -q /tmp/pfx-vector-core.zip -d /tmp/pfx-vector-core
          cp -a /tmp/pfx-vector-core/pfx-vector-core/. .
          rm -f .pfx-bootstrap-payload.b64
          rm -f .github/workflows/bootstrap.yml

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pfxamd"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Initial PFx Vector Core v0.1"
          git push origin HEAD:main
