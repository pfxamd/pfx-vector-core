name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Verify architecture boundaries
        run: python3 scripts/verify_structure.py
      - name: Apply rustfmt on feature branch
        run: cargo fmt --all
      - name: Commit rustfmt changes
        run: |
          if ! git diff --quiet; then
            git config user.name "PFxamd"
            git config user.email "pfxamd@gmail.com"
            git add --all
            git commit -m "style: apply rustfmt to advanced intersections"
            git push
          fi
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Build benchmark targets
        run: cargo bench -p pfx-vector-core --no-run
      - name: Build WebAssembly target
        run: cargo build -p pfx-vector-wasm --target wasm32-unknown-unknown

  web:
    name: TypeScript wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: packages/pfx-vector-web
      - run: npm run typecheck
        working-directory: packages/pfx-vector-web

  release:
    name: Release tag
    needs: [rust, web]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate version and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TAG="${RELEASE_MESSAGE#release: }"
          VERSION="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          EXPECTED="v${VERSION}"

          if [ "${TAG}" != "${EXPECTED}" ]; then
            echo "Release tag ${TAG} does not match workspace version ${EXPECTED}."
            exit 1
          fi

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
            exit 1
          fi

          git config user.name "PFxamd"
          git config user.email "pfxamd@gmail.com"
          git tag -a "${TAG}" -m "PFx Vector Core ${TAG}"
          git push origin "${TAG}"
          gh release create "${TAG}" --title "PFx Vector Core ${TAG}" --generate-notes
