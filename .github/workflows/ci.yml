name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Verify architecture boundaries
        run: python3 scripts/verify_structure.py
      - name: Apply rustfmt
        if: github.event_name == 'push'
        run: cargo fmt --all
      - name: Commit rustfmt changes
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet; then
            git config user.name "PFxamd"
            git config user.email "pfxamd@gmail.com"
            git add --all
            git commit -m "style: apply rustfmt"
            git push
          fi
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Build benchmark targets
        run: cargo bench -p pfx-vector-core --no-run
      - name: Build WebAssembly target
        run: cargo build -p pfx-vector-wasm --target wasm32-unknown-unknown

  web-wrapper:
    name: TypeScript wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: packages/pfx-vector-web
      - run: npm run typecheck
        working-directory: packages/pfx-vector-web
