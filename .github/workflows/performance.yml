name: Performance probe

on:
  push:
    branches: [main]
    paths:
      - "crates/pfx-vector-core/examples/measure_stress.rs"
      - "crates/pfx-vector-core/examples/measure_soak.rs"
      - "crates/pfx-vector-core/src/**"
      - ".github/workflows/performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Linux release stress probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run timed memory probe
        run: cargo run --release -p pfx-vector-core --example measure_stress
      - name: Run repeated-build memory probe
        run: cargo run --release -p pfx-vector-core --example measure_soak
